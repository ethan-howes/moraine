receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed
  kafka:
    brokers:
      - b-1.morainekafka.fld35a.c5.kafka.us-east-2.amazonaws.com:9092
      - b-2.morainekafka.fld35a.c5.kafka.us-east-2.amazonaws.com:9092
    traces:
      topic: talus.traces
      encoding: otlp_proto

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, kafka]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
