# Moraine overlay for Talus.
#
# From the Talus repo directory:
# docker compose -f deployments/docker-compose.yml -f /path/to/moraine/docker-compose.moraine.yml up

services:

  # Add SYS_PTRACE to each Talus service
  ingestion:
    cap_add:
      - SYS_PTRACE

  terrain:
    cap_add:
      - SYS_PTRACE

  hazard:
    cap_add:
      - SYS_PTRACE

  gateway:
    cap_add:
      - SYS_PTRACE

  otel-ingestion:
    image: ghcr.io/open-telemetry/opentelemetry-go-instrumentation/autoinstrumentation-go:latest
    pid: "service:ingestion"
    privileged: true
    environment:
      OTEL_GO_AUTO_TARGET_EXE: /app/ingestion-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: talus-ingestion
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on:
      - ingestion
      - otel-collector

  otel-terrain:
    image: ghcr.io/open-telemetry/opentelemetry-go-instrumentation/autoinstrumentation-go:latest
    pid: "service:terrain"
    privileged: true
    environment:
      OTEL_GO_AUTO_TARGET_EXE: /app/terrain-service  # verify against terrain.Dockerfile
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: talus-terrain
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on:
      - terrain
      - otel-collector

  otel-hazard:
    image: ghcr.io/open-telemetry/opentelemetry-go-instrumentation/autoinstrumentation-go:latest
    pid: "service:hazard"
    privileged: true
    environment:
      OTEL_GO_AUTO_TARGET_EXE: /app/hazard-service  # verify against hazard.Dockerfile
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: talus-hazard
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on:
      - hazard
      - otel-collector

  otel-gateway:
    image: ghcr.io/open-telemetry/opentelemetry-go-instrumentation/autoinstrumentation-go:latest
    pid: "service:gateway"
    privileged: true
    environment:
      OTEL_GO_AUTO_TARGET_EXE: /app/gateway-service  # verify against gateway.Dockerfile
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: talus-gateway
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on:
      - gateway
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    hostname: otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ${PWD}/otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  generator:
    build:
      context: /home/yart/Desktop/personal-projects/moraine/generator
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    depends_on:
      - otel-collector
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: moraine-kafka
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"

  aggregator:
    build:
      context: /home/yart/Desktop/personal-projects/moraine
      dockerfile: services/aggregator/Dockerfile
    environment:
      AGGREGATOR_PORT: "50051"
    ports:
      - "50051:50051"

  alert-engine:
    build:
      context: /home/yart/Desktop/personal-projects/moraine
      dockerfile: services/alert-engine/Dockerfile
    environment:
      ALERT_ENGINE_PORT: "50052"
      ALERT_WEBHOOK_URL: ""
    ports:
      - "50052:50052"

  stream-processor:
    build:
      context: /home/yart/Desktop/personal-projects/moraine
      dockerfile: services/stream-processor/Dockerfile
    environment:
      KAFKA_BROKER: kafka:9092
      AGGREGATOR_ADDR: aggregator:50051
      ALERT_ENGINE_ADDR: alert-engine:50052
    depends_on:
      - kafka
      - aggregator
      - alert-engine
