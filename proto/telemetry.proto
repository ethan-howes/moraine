syntax = "proto3";

package moraine;

option go_package = "github.com/ethan-howes/moraine/proto";

message TelemetryEvent {
  string service_name  = 1;
  string span_name     = 2;
  double duration_ms   = 3;
  int32  status_code   = 4;
  int64  timestamp     = 5;
  string trace_id      = 6;
  string error_message = 7;
}
