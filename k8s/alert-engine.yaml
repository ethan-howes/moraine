apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-engine
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-engine
  template:
    metadata:
      labels:
        app: alert-engine
    spec:
      containers:
        - name: alert-engine
          image: 027958789002.dkr.ecr.us-east-2.amazonaws.com/moraine/alert-engine:latest
          env:
            - name: ALERT_ENGINE_PORT
              value: "50052"
            - name: ALERT_WEBHOOK_URL
              value: ""
          ports:
            - containerPort: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: alert-engine
  namespace: default
spec:
  selector:
    app: alert-engine
  ports:
    - port: 50052
      targetPort: 50052
